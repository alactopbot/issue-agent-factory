# Required gates by level. A required gate that cannot run makes the verdict
# MISCONFIGURED (exit 2), never GREEN. Space-separated gate names.
#
# Available names: types lint test build mutation architecture
# Add build, mutation, or architecture only when the repository has a real
# command for it. An empty required architecture command is MISCONFIGURED.
# Run dependency security audits explicitly when needed; they are not part of
# the deterministic Factory verdict because they can depend on external services.

REQUIRED_FAST="types lint"
REQUIRED_FULL="types lint test"
REQUIRED_DEEP="types lint test"

# Example: ARCHITECTURE_COMMAND="npm run architecture"
ARCHITECTURE_COMMAND=""
